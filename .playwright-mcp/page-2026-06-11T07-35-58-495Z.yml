        - heading "From sentiment to a position" [level=2] [ref=e296]
      - generic [ref=e297]:
        - paragraph [ref=e298]: "Daily sentiment is smoothed with a rolling mean (to cut noise), then mapped to a position:"
        - code [ref=e300]: "s = rolling_mean(daily_sentiment, window) if s > threshold: position = +1 # long (hold BTC) elif s < -threshold: position = -1 # short (if enabled) else 0 else: position = hold previous"
        - paragraph [ref=e301]: Threshold, smoothing window, and whether shorting is allowed are all tunable live in the dashboard.

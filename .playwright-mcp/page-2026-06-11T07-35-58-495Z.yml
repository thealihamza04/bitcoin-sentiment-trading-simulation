        - heading "An honest backtest" [level=2] [ref=e308]
      - generic [ref=e309]:
        - paragraph [ref=e310]: "The simulation is deliberately strict to avoid the classic ways backtests lie:"
        - generic [ref=e311]:
          - generic [ref=e312]:
            - text: No look-ahead — Today's sentiment decides today's position, which earns
            - emphasis [ref=e313]: tomorrow's
            - text: return. The model never sees information from the future.
          - generic [ref=e314]: Transaction costs — A configurable cost (basis points) is charged every time the position changes, penalising over-trading.
          - generic [ref=e315]: Benchmark — Performance is always shown against buy-and-hold — the honest bar any strategy must clear.
          - generic [ref=e316]: Metrics — Total return, CAGR, Sharpe ratio (risk-adjusted), max drawdown (worst peak-to-trough), win rate, and trade count.

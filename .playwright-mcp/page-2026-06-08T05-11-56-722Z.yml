        - heading "From sentiment to a position" [level=2] [ref=e266]
      - generic [ref=e267]:
        - paragraph [ref=e268]: "Daily sentiment is smoothed with a rolling mean (to cut noise), then mapped to a position:"
        - code [ref=e270]: "s = rolling_mean(daily_sentiment, window) if s > threshold: position = +1 # long (hold BTC) elif s < -threshold: position = -1 # short (if enabled) else 0 else: position = hold previous"
        - paragraph [ref=e271]: Threshold, smoothing window, and whether shorting is allowed are all tunable live in the dashboard.

        - heading "An honest backtest" [level=2] [ref=e278]
      - generic [ref=e279]:
        - paragraph [ref=e280]: "The simulation is deliberately strict to avoid the classic ways backtests lie:"
        - generic [ref=e281]:
          - generic [ref=e282]:
            - text: No look-ahead — Today's sentiment decides today's position, which earns
            - emphasis [ref=e283]: tomorrow's
            - text: return. The model never sees information from the future.
          - generic [ref=e284]: Transaction costs — A configurable cost (basis points) is charged every time the position changes, penalising over-trading.
          - generic [ref=e285]: Benchmark — Performance is always shown against buy-and-hold — the honest bar any strategy must clear.
          - generic [ref=e286]: Metrics — Total return, CAGR, Sharpe ratio (risk-adjusted), max drawdown (worst peak-to-trough), win rate, and trade count.

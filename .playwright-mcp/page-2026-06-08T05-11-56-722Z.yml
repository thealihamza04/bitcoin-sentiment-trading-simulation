        - paragraph [ref=e313]: "Why? A few honest reasons:"
        - list [ref=e314]:
          - listitem [ref=e315]: Daily headline sentiment is a weak, noisy signal — much news is already priced in by the time it's published.
          - listitem [ref=e316]: FinBERT was trained on formal financial sentences, so short, slangy crypto headlines are partly out-of-distribution.
          - listitem [ref=e317]: Bitcoin's strong multi-year trend is hard to beat by sitting in cash during dips.
        - paragraph [ref=e318]: Crucially, the framework lets you measure this rather than guess — and tuning the threshold, smoothing, or enabling shorts changes the outcome, which is exactly the kind of exploration the dashboard is for.
